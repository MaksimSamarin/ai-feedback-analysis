services:
  postgres:
    image: ${POSTGRES_IMAGE:-${DOCKER_REGISTRY_PREFIX:-}postgres:${POSTGRES_IMAGE_VERSION:-16-alpine}}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - autovacuum=on
      - -c
      - autovacuum_naptime=10s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - autovacuum_max_workers=6
      - -c
      - max_wal_size=4GB
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-review_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review_analyzer}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-review_analyzer} -d ${POSTGRES_DB:-review_analyzer}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus:  3.0
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  redis:
    image: ${REDIS_IMAGE:-${DOCKER_REGISTRY_PREFIX:-}redis:${REDIS_IMAGE_VERSION:-7-alpine}}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus:  0.5
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-${DOCKER_REGISTRY_PREFIX:-}python:${PYTHON_BASE_IMAGE_VERSION:-3.12-slim}}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    restart: unless-stopped
    environment:
      OPENAI_EXTRA_HEADERS_JSON: ${OPENAI_EXTRA_HEADERS_JSON:-}
      OPENAI_EXTRA_BODY_JSON: ${OPENAI_EXTRA_BODY_JSON:-}
      SESSION_USER_CACHE_TTL_SEC: ${SESSION_USER_CACHE_TTL_SEC:-15}
      SESSION_USER_CACHE_MAX: ${SESSION_USER_CACHE_MAX:-5000}
      LLM_RATE_LIMIT_RETRIES: ${LLM_RATE_LIMIT_RETRIES:-6}
      LLM_RATE_LIMIT_MAX_WAIT_SEC: ${LLM_RATE_LIMIT_MAX_WAIT_SEC:-60}
      GROUP_MAX_ROWS: ${GROUP_MAX_ROWS:-100000}
      HASH_PARTITIONS: ${HASH_PARTITIONS:-100}
      REPORT_KEEP_LAST: ${REPORT_KEEP_LAST:-20}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-200}
      JOB_CLEANUP_DELAY_SEC: ${JOB_CLEANUP_DELAY_SEC:-300}
      JOB_QUEUE_DEDUP_TTL_SEC: ${JOB_QUEUE_DEDUP_TTL_SEC:-604800}
      NOISY_ACCESS_LOG_SLOW_MS: ${NOISY_ACCESS_LOG_SLOW_MS:-250}
      REPORT_CLEANUP_INTERVAL_SEC: ${REPORT_CLEANUP_INTERVAL_SEC:-600}
      UPLOAD_ORPHAN_TTL_HOURS: ${UPLOAD_ORPHAN_TTL_HOURS:-24}
      WORKER_QUEUED_STALE_SEC: ${WORKER_QUEUED_STALE_SEC:-90}
      WORKER_RUNNING_STALE_SEC: ${WORKER_RUNNING_STALE_SEC:-90}
      WORKER_RUNNING_LEASE_TTL_SEC: ${WORKER_RUNNING_LEASE_TTL_SEC:-30}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS_API:-60000}
      LIMIT_USAGE_CACHE_TTL_SEC: ${LIMIT_USAGE_CACHE_TTL_SEC:-2}
      PAUSED_REPORT_TTL_DAYS: ${PAUSED_REPORT_TTL_DAYS:-0}
      PARTIAL_EXPORT_CACHE_ENABLED: ${PARTIAL_EXPORT_CACHE_ENABLED:-1}
      PARTIAL_EXPORT_CACHE_TTL_HOURS: ${PARTIAL_EXPORT_CACHE_TTL_HOURS:-6}
      PARTIAL_EXPORT_WAIT_SEC: ${PARTIAL_EXPORT_WAIT_SEC:-300}
      TLS_VERIFY: ${TLS_VERIFY:-1}
      STRUCTURED_LOG_DB: ${STRUCTURED_LOG_DB:-1}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-1}
      LOCAL_REGISTRATION_ENABLED: ${LOCAL_REGISTRATION_ENABLED:-}
      SSO_ENABLED: ${SSO_ENABLED:-0}
      SSO_ISSUER_URL: ${SSO_ISSUER_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URL: ${SSO_REDIRECT_URL:-}
      SSO_ALLOW_HTTP: ${SSO_ALLOW_HTTP:-0}
      SSO_CA_FILE: ${SSO_CA_FILE:-}
      SSO_TOKEN_AUTH_METHOD: ${SSO_TOKEN_AUTH_METHOD:-auto}
      SSO_ADMIN_USERNAMES: ${SSO_ADMIN_USERNAMES:-}
      SSO_ADMIN_SUBJECTS: ${SSO_ADMIN_SUBJECTS:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODELS: ${OPENAI_MODELS:-gpt-4o-mini,gpt-4.1-mini}
      OPENAI_PROVIDER_LABEL: ${OPENAI_PROVIDER_LABEL:-OpenAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-}
      AI_PROVIDERS_CONFIG_PATH: ${AI_PROVIDERS_CONFIG_PATH:-/app/config/ai_providers.json}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session_token}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FORCE_PASSWORD: ${BOOTSTRAP_ADMIN_FORCE_PASSWORD:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_TIMEOUT_SEC: ${REQUEST_TIMEOUT_SEC:-180}
      LLM_RETRIES: ${LLM_RETRIES:-2}
      MAX_LLM_CACHE_ROWS: ${MAX_LLM_CACHE_ROWS:-2000000}
      MAX_SEMANTIC_CACHE_ROWS: ${MAX_SEMANTIC_CACHE_ROWS:-500000}
      CACHE_MAINTENANCE_INTERVAL_SEC: ${CACHE_MAINTENANCE_INTERVAL_SEC:-300}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.94}
      SEMANTIC_CACHE_CANDIDATES: ${SEMANTIC_CACHE_CANDIDATES:-200}
      GLOBAL_LLM_PARALLELISM: ${GLOBAL_LLM_PARALLELISM:-12}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_KEY: ${REDIS_QUEUE_KEY:-review_analyzer:jobs}
      REDIS_INSPECT_QUEUE_KEY: ${REDIS_INSPECT_QUEUE_KEY:-review_analyzer:file_inspect_jobs}
      DATABASE_URL: ${DATABASE_URL:-postgresql://review_analyzer:review_analyzer@postgres:5432/review_analyzer}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-12}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_results:/app/results
      - ./examples:/app/examples:ro
      - ./docs:/app/docs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1500m
    cpus:  0.75
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-${DOCKER_REGISTRY_PREFIX:-}python:${PYTHON_BASE_IMAGE_VERSION:-3.12-slim}}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      OPENAI_EXTRA_HEADERS_JSON: ${OPENAI_EXTRA_HEADERS_JSON:-}
      OPENAI_EXTRA_BODY_JSON: ${OPENAI_EXTRA_BODY_JSON:-}
      LLM_RATE_LIMIT_RETRIES: ${LLM_RATE_LIMIT_RETRIES:-6}
      LLM_RATE_LIMIT_MAX_WAIT_SEC: ${LLM_RATE_LIMIT_MAX_WAIT_SEC:-60}
      GROUP_MAX_ROWS: ${GROUP_MAX_ROWS:-100000}
      HASH_PARTITIONS: ${HASH_PARTITIONS:-100}
      REPORT_KEEP_LAST: ${REPORT_KEEP_LAST:-20}
      JOB_CLEANUP_DELAY_SEC: ${JOB_CLEANUP_DELAY_SEC:-300}
      JOB_QUEUE_DEDUP_TTL_SEC: ${JOB_QUEUE_DEDUP_TTL_SEC:-604800}
      NOISY_ACCESS_LOG_SLOW_MS: ${NOISY_ACCESS_LOG_SLOW_MS:-250}
      REPORT_CLEANUP_INTERVAL_SEC: ${REPORT_CLEANUP_INTERVAL_SEC:-600}
      UPLOAD_ORPHAN_TTL_HOURS: ${UPLOAD_ORPHAN_TTL_HOURS:-24}
      WORKER_QUEUED_STALE_SEC: ${WORKER_QUEUED_STALE_SEC:-90}
      WORKER_RUNNING_STALE_SEC: ${WORKER_RUNNING_STALE_SEC:-90}
      WORKER_RUNNING_LEASE_TTL_SEC: ${WORKER_RUNNING_LEASE_TTL_SEC:-30}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS_WORKER:-0}
      PAUSED_REPORT_TTL_DAYS: ${PAUSED_REPORT_TTL_DAYS:-0}
      PARTIAL_EXPORT_CACHE_ENABLED: ${PARTIAL_EXPORT_CACHE_ENABLED:-1}
      PARTIAL_EXPORT_CACHE_TTL_HOURS: ${PARTIAL_EXPORT_CACHE_TTL_HOURS:-6}
      PARTIAL_EXPORT_WAIT_SEC: ${PARTIAL_EXPORT_WAIT_SEC:-300}
      LIMIT_USAGE_CACHE_TTL_SEC: ${LIMIT_USAGE_CACHE_TTL_SEC:-2}
      LIMIT_REFRESH_THRESHOLD_TOKENS: ${LIMIT_REFRESH_THRESHOLD_TOKENS:-1024}
      LIMIT_ESTIMATED_REQUEST_TOKENS: ${LIMIT_ESTIMATED_REQUEST_TOKENS:-256}
      TLS_VERIFY: ${TLS_VERIFY:-1}
      STRUCTURED_LOG_DB: ${STRUCTURED_LOG_DB:-1}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODELS: ${OPENAI_MODELS:-gpt-4o-mini,gpt-4.1-mini}
      OPENAI_PROVIDER_LABEL: ${OPENAI_PROVIDER_LABEL:-OpenAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-}
      AI_PROVIDERS_CONFIG_PATH: ${AI_PROVIDERS_CONFIG_PATH:-/app/config/ai_providers.json}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_TIMEOUT_SEC: ${REQUEST_TIMEOUT_SEC:-180}
      LLM_RETRIES: ${LLM_RETRIES:-2}
      MAX_LLM_CACHE_ROWS: ${MAX_LLM_CACHE_ROWS:-2000000}
      MAX_SEMANTIC_CACHE_ROWS: ${MAX_SEMANTIC_CACHE_ROWS:-500000}
      CACHE_MAINTENANCE_INTERVAL_SEC: ${CACHE_MAINTENANCE_INTERVAL_SEC:-300}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.94}
      SEMANTIC_CACHE_CANDIDATES: ${SEMANTIC_CACHE_CANDIDATES:-200}
      GLOBAL_LLM_PARALLELISM: ${GLOBAL_LLM_PARALLELISM:-12}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_KEY: ${REDIS_QUEUE_KEY:-review_analyzer:jobs}
      REDIS_INSPECT_QUEUE_KEY: ${REDIS_INSPECT_QUEUE_KEY:-review_analyzer:file_inspect_jobs}
      DATABASE_URL: ${DATABASE_URL:-postgresql://review_analyzer:review_analyzer@postgres:5432/review_analyzer}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-12}
      WORKER_MODE: analysis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_results:/app/results
    mem_limit: 2500m
    cpus:  1.0
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  inspect-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-${DOCKER_REGISTRY_PREFIX:-}python:${PYTHON_BASE_IMAGE_VERSION:-3.12-slim}}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      OPENAI_EXTRA_HEADERS_JSON: ${OPENAI_EXTRA_HEADERS_JSON:-}
      OPENAI_EXTRA_BODY_JSON: ${OPENAI_EXTRA_BODY_JSON:-}
      LLM_RATE_LIMIT_RETRIES: ${LLM_RATE_LIMIT_RETRIES:-6}
      LLM_RATE_LIMIT_MAX_WAIT_SEC: ${LLM_RATE_LIMIT_MAX_WAIT_SEC:-60}
      GROUP_MAX_ROWS: ${GROUP_MAX_ROWS:-100000}
      HASH_PARTITIONS: ${HASH_PARTITIONS:-100}
      REPORT_KEEP_LAST: ${REPORT_KEEP_LAST:-20}
      JOB_CLEANUP_DELAY_SEC: ${JOB_CLEANUP_DELAY_SEC:-300}
      JOB_QUEUE_DEDUP_TTL_SEC: ${JOB_QUEUE_DEDUP_TTL_SEC:-604800}
      NOISY_ACCESS_LOG_SLOW_MS: ${NOISY_ACCESS_LOG_SLOW_MS:-250}
      REPORT_CLEANUP_INTERVAL_SEC: ${REPORT_CLEANUP_INTERVAL_SEC:-600}
      UPLOAD_ORPHAN_TTL_HOURS: ${UPLOAD_ORPHAN_TTL_HOURS:-24}
      WORKER_QUEUED_STALE_SEC: ${WORKER_QUEUED_STALE_SEC:-90}
      WORKER_RUNNING_STALE_SEC: ${WORKER_RUNNING_STALE_SEC:-90}
      WORKER_RUNNING_LEASE_TTL_SEC: ${WORKER_RUNNING_LEASE_TTL_SEC:-30}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS_INSPECT:-0}
      TLS_VERIFY: ${TLS_VERIFY:-1}
      STRUCTURED_LOG_DB: ${STRUCTURED_LOG_DB:-1}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODELS: ${OPENAI_MODELS:-gpt-4o-mini,gpt-4.1-mini}
      OPENAI_PROVIDER_LABEL: ${OPENAI_PROVIDER_LABEL:-OpenAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-}
      AI_PROVIDERS_CONFIG_PATH: ${AI_PROVIDERS_CONFIG_PATH:-/app/config/ai_providers.json}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_TIMEOUT_SEC: ${REQUEST_TIMEOUT_SEC:-180}
      LLM_RETRIES: ${LLM_RETRIES:-2}
      MAX_LLM_CACHE_ROWS: ${MAX_LLM_CACHE_ROWS:-2000000}
      MAX_SEMANTIC_CACHE_ROWS: ${MAX_SEMANTIC_CACHE_ROWS:-500000}
      CACHE_MAINTENANCE_INTERVAL_SEC: ${CACHE_MAINTENANCE_INTERVAL_SEC:-300}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.94}
      SEMANTIC_CACHE_CANDIDATES: ${SEMANTIC_CACHE_CANDIDATES:-200}
      GLOBAL_LLM_PARALLELISM: ${GLOBAL_LLM_PARALLELISM:-12}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_KEY: ${REDIS_QUEUE_KEY:-review_analyzer:jobs}
      REDIS_INSPECT_QUEUE_KEY: ${REDIS_INSPECT_QUEUE_KEY:-review_analyzer:file_inspect_jobs}
      DATABASE_URL: ${DATABASE_URL:-postgresql://review_analyzer:review_analyzer@postgres:5432/review_analyzer}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-12}
      WORKER_MODE: inspect
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_results:/app/results
    mem_limit: 2g
    cpus:  0.75
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-${DOCKER_REGISTRY_PREFIX:-}node:${NODE_BASE_IMAGE_VERSION:-20-alpine}}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-${DOCKER_REGISTRY_PREFIX:-}nginx:${NGINX_BASE_IMAGE_VERSION:-1.27-alpine}}
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://registry.npmjs.org/}
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
        APK_REPOSITORY_MAIN_URL: ${APK_REPOSITORY_MAIN_URL:-}
        APK_REPOSITORY_COMMUNITY_URL: ${APK_REPOSITORY_COMMUNITY_URL:-}
        APK_TLS_NO_VERIFY: ${APK_TLS_NO_VERIFY:-false}
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./branding:/usr/share/nginx/html/branding:ro
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    mem_limit: 512m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

volumes:
  backend_data:
  backend_results:
  pg_data:
  redis_data:
